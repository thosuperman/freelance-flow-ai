# Local development database only. Production uses a managed PostgreSQL (see docs/DEPLOYMENT.md).
services:
  db:
    image: postgres:16-alpine
    container_name: freelanceflow-db
    environment:
      POSTGRES_USER: freelanceflow
      POSTGRES_PASSWORD: freelanceflow
      POSTGRES_DB: freelanceflow
    ports:
      - "54329:5432"
    volumes:
      - freelanceflow-pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freelanceflow"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  freelanceflow-pgdata:
